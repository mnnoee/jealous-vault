name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOAMD64: v1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: govulncheck
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: licenses
        run: |
          set -eu
          go install github.com/google/go-licenses@v1.6.0
          "$(go env GOPATH)/bin/go-licenses" check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,Unlicense

      - name: build
        run: |
          set -eu
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/jealous-vault-linux-amd64 ./cmd/jealous-vault
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/jealous-vault-linux-arm64 ./cmd/jealous-vault

      - name: amd64 v1 smoke on qemu64
        run: |
          set -eu
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user; then
              ok=1
              break
            fi
            sleep 5
          done
          test "${ok}" = 1
          QEMU="$(command -v qemu-x86_64-static || command -v qemu-x86_64)"
          test -n "${QEMU}"
          "${QEMU}" -cpu qemu64 dist/jealous-vault-linux-amd64 version
